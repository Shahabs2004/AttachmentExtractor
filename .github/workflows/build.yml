name: Build & Publish

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & publish (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AttachmentExtractor.slnx

      - name: Build
        run: dotnet build AttachmentExtractor.slnx --configuration Release --no-restore

      - name: Publish portable (self-contained, single file)
        run: >
          dotnet publish src/AttachmentExtractor.App/AttachmentExtractor.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          --output publish/portable

      - name: Publish light (framework-dependent, single file)
        run: >
          dotnet publish src/AttachmentExtractor.App/AttachmentExtractor.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=embedded
          --output publish/light

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: AttachmentExtractor-win-x64-portable
          path: publish/portable
          if-no-files-found: error
          retention-days: 14

      - name: Upload light artifact
        uses: actions/upload-artifact@v7
        with:
          name: AttachmentExtractor-win-x64-light
          path: publish/light
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@v8
        with:
          name: AttachmentExtractor-win-x64-portable
          path: dist/portable

      - name: Download light artifact
        uses: actions/download-artifact@v8
        with:
          name: AttachmentExtractor-win-x64-light
          path: dist/light

      - name: Create release archives
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/portable/*' -DestinationPath "AttachmentExtractor-${{ github.ref_name }}-win-x64-portable.zip"
          Compress-Archive -Path 'dist/light/*' -DestinationPath "AttachmentExtractor-${{ github.ref_name }}-win-x64-light.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: |
            AttachmentExtractor-${{ github.ref_name }}-win-x64-portable.zip
            AttachmentExtractor-${{ github.ref_name }}-win-x64-light.zip
          generate_release_notes: true
          append_body: |
            ## فایل‌های انتشار

            - `AttachmentExtractor-${{ github.ref_name }}-win-x64-portable.zip` — نسخه پرتابل و خودکفا؛ نیازی به نصب .NET ندارد.
            - `AttachmentExtractor-${{ github.ref_name }}-win-x64-light.zip` — نسخه سبک؛ نیازمند **.NET Desktop Runtime 10 (x64)** است.
          prerelease: ${{ contains(github.ref_name, '-') }}

name: Build & Publish

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & publish (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AttachmentExtractor.slnx

      - name: Build
        run: dotnet build AttachmentExtractor.slnx --configuration Release --no-restore

      - name: Publish self-contained single-file (win-x64)
        run: >
          dotnet publish src/AttachmentExtractor.App/AttachmentExtractor.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          --output publish/win-x64

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: AttachmentExtractor-win-x64
          path: publish/win-x64
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: AttachmentExtractor-win-x64
          path: dist

      - name: Create release archive
        shell: pwsh
        run: >
          Compress-Archive
          -Path 'dist/*'
          -DestinationPath "AttachmentExtractor-${{ github.ref_name }}-win-x64.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: AttachmentExtractor-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
